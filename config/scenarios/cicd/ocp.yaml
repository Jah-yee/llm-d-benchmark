# OpenShift Container Platform CI/CD Scenario
# Based on scenarios/cicd/ocp_fb.sh
#
# CI/CD scenario for OpenShift clusters.
# Uses Qwen/Qwen3-8B so the standalone baseline and FMA nightlies exercise a
# representative model whose cold start is measurable.
# GPU affinity is auto-detected (commented out in original).

scenario:
  - name: "ocp-cicd"

    # Model
    # TEMP (do not merge): 32B (GPTQ-Int8) for the cold-start-by-model-size
    # experiment, matching the blog's Table B. Sizes run: Qwen3-8B ->
    # Qwen2.5-14B-Instruct -> Qwen2.5-32B-Instruct-GPTQ-Int8.
    model:
      name: Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      shortName: qwen-qwen2.5-32b-instruct-gptq-int8
      path: models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      huggingfaceId: Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      # Keeping it similar to FMA launcher's vLLM (24_fma-deployment.yaml.j2)
      maxModelLen: 40960
      blockSize: 16

    # Deployment method
    modelservice:
      enabled: true
    standalone:
      enabled: false
    fma:
      enabled: false
      iterations: 10

#    gateway:
#      className: istio

    affinity:
      enabled: true
      nodeSelector:
#        nvidia.com/gpu.product: NVIDIA-L40S
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

    prefill:
      enabled: true
      replicas: 1
      acceleratorType:
        labelKey: nvidia.com/gpu.product
#        labelValue: NVIDIA-L40S
        labelValue: NVIDIA-H100-80GB-HBM3

    decode:
      enabled: true
      replicas: 1
      acceleratorType:
        labelKey: nvidia.com/gpu.product
#        labelValue: NVIDIA-L40S
        labelValue: NVIDIA-H100-80GB-HBM3

    standalone:
      acceleratorType:
        labelKey: nvidia.com/gpu.product
#        labelValue: NVIDIA-L40S
        labelValue: NVIDIA-H100-80GB-HBM3

#    storage:
#      modelPvc:
#        storageClassName: ocs-storagecluster-cephfs
#      workloadPvc:
#        storageClassName: ocs-storagecluster-cephfs

    vllmCommon:
      priorityClassName: nightly-gpu-critical
      flags:
        # Disable enforce_eager so the standalone vLLM runs torch.compile +
        # CUDA-graph capture -- otherwise Dynamo / Torch Compile / Memory
        # Profiling metrics are all 0 (those phases are skipped under eager).
        enforceEager: false
        # FMA runs with prefix caching off (--no-enable-prefix-caching)
        noPrefixCaching: true

    workDir: /tmp/llmdbenchcicd-ocp/

    harness:
      name: vllm-benchmark
      experimentProfile: sanity_random.yaml
#      executable: llm-d-benchmark.py

    images:
      benchmark:
        repository: ghcr.io/llm-d/llm-d-benchmark
        tag: nightly

